# Woodpecker CI Pipeline Configuration
# This pipeline runs quality checks, builds Docker images, and deploys to production

# Pipeline steps
steps:
  # ============================================================================
  # Step 1: Code Quality Checks
  # ============================================================================
  check:
    image: denoland/deno:latest
    when:
      event:
        - push
        - pull_request
    environment:
      DENO_DIR: /deno-dir
    volumes:
      - deno-cache:/deno-dir
    commands:
      - echo "Running code quality checks with Deno cache..."
      - deno task check
  
  build:
    image: denoland/deno:latest
    when:
      event:
        - push
        - pull_request
    environment:
      DENO_DIR: /deno-dir
    volumes:
      - deno-cache:/deno-dir
    commands:
      - echo "Building the project with Deno cache..."
      - deno task build
    depends_on:
      - check

  # ============================================================================
  # Step 2: Build Docker Images (Production)
  # ============================================================================
  pre-deploy-build:
    image: denoland/deno:latest
    environment:
      ENV: prod
      DENO_VERSION:
        from_secret: deno_version
      DB_HOST:
        from_secret: db_host
      DB_PORT:
        from_secret: db_port
      DB_NAME:
        from_secret: db_name
      DB_USER:
        from_secret: db_user
      DB_PASSWORD:
        from_secret: db_password
      KV_HOSTNAME:
        from_secret: kv_hostname
      KV_PORT:
        from_secret: kv_port
      API_PORT:
        from_secret: api_port
      WEB_PORT:
        from_secret: web_port
      DOMAIN:
        from_secret: domain
      TRAEFIK_ACME_EMAIL:
        from_secret: traefik_acme_email
      SSH_TO_SERVER:
        from_secret: ssh_to_server
      PATH_ON_SERVER:
        from_secret: path_on_server
    commands:
      - echo "Creating production environment file..."
      # Create the .env.prod file from environment variables
      - |
        cat > ./infra/envs/.env.prod << EOF
        ENV=prod
        DENO_VERSION=${DENO_VERSION}
        DB_HOST=${DB_HOST}
        DB_PORT=${DB_PORT}
        DB_NAME=${DB_NAME}
        DB_USER=${DB_USER}
        DB_PASSWORD=${DB_PASSWORD}
        KV_HOSTNAME=${KV_HOSTNAME}
        KV_PORT=${KV_PORT}
        API_PORT=${API_PORT}
        WEB_PORT=${WEB_PORT}
        DOMAIN=${DOMAIN}
        TRAEFIK_ACME_EMAIL=${TRAEFIK_ACME_EMAIL}
        SSH_TO_SERVER=${SSH_TO_SERVER}
        PATH_ON_SERVER=${PATH_ON_SERVER}
        EOF
      - echo "Building Docker images..."
      - deno task compose --env-file=./infra/envs/.env.prod build
    when:
      event: push
      branch: main
    depends_on:
      - build

  # ============================================================================
  # Step 3: Deploy to Production
  # ============================================================================
  deploy:
    image: denoland/deno:latest
    environment:
      SSH_TO_SERVER:
        from_secret: ssh_to_server
      PATH_ON_SERVER:
        from_secret: path_on_server
      SSH_PRIVATE_KEY:
        from_secret: ssh_private_key
    commands:
      - echo "Setting up SSH..."
      # Install rsync and ssh client
      - apt-get update && apt-get install -y rsync openssh-client
      # Setup SSH key
      - mkdir -p ~/.ssh
      - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      # Add server to known hosts (adjust hostname as needed)
      - ssh-keyscan -H $(echo $SSH_TO_SERVER | cut -d'@' -f2) >> ~/.ssh/known_hosts
      - echo "Deploying to production..."
      - deno task deploy
    when:
      event: push
      branch: main
    depends_on:
      - pre-deploy-build

