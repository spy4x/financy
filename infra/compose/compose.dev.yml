services:
      
  db:
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    user: "0:0"  # Run as root in dev mode for Podman compatibility
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
    security_opt:
      - label=disable
    healthcheck:
      interval: 3s

  web:
    user: "0:0"  # Run as root in dev mode for Podman compatibility
    ports:
      - "5173:5173"
    environment:
      - VITE_ENV=dev
    build:
      dockerfile: apps/web/dockerfile.dev
      args:
        - DENO_VERSION=${DENO_VERSION}
    security_opt:
      - label=disable
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:5173"]
      interval: 3s
