<!doctype html>
<!--
  The Open Graph card of one website page, 1200×630. capture.ts opens it with the words in the
  query string (eyebrow, title, sub, shot, top, left, width, and cardWidth and cardHeight for another
  size, as docs/screenshots/record.ts's social preview) and photographs it. Self-contained: its
  fonts come from the pinned geist package that capture.ts unpacks, and nothing loads from outside.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Financy social card</title>
    <style>
    @font-face {
      font-family: "Geist";
      src: url("/fonts/geist-sans.woff2") format("woff2");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("/fonts/geist-mono.woff2") format("woff2");
      font-weight: 100 900;
    }
    :root {
      --bg: #0a0a0c;
      --text: #f4f4f6;
      --muted: #a1a1aa;
      --line: rgba(255, 255, 255, 0.055);
      --accent: #7ea6f4;
    }
    * {
      box-sizing: border-box;
      margin: 0;
    }
    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      position: relative;
      background: var(--bg);
      color: var(--text);
      font-family: "Geist", sans-serif;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 70% 20%, #000 20%, transparent 80%);
    }
    .glow {
      position: absolute;
      top: -260px;
      right: -200px;
      width: 760px;
      height: 620px;
      background: radial-gradient(closest-side, rgba(24, 83, 198, 0.55), transparent);
    }
    .shot {
      position: absolute;
      top: 96px;
      right: -40px;
      width: 520px;
      height: 400px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }
    .shot img {
      display: block;
      width: 860px;
      height: auto;
    }
    .copy {
      position: absolute;
      left: 72px;
      top: 96px;
      width: 1056px;
    }
    body.with-shot .copy {
      width: 560px;
    }
    .eyebrow {
      font-family: "Geist Mono", monospace;
      font-size: 20px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin-top: 28px;
      font-size: 68px;
      line-height: 1.06;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    body.with-shot h1 {
      font-size: 58px;
    }
    .sub {
      margin-top: 28px;
      font-size: 26px;
      line-height: 1.35;
      color: var(--muted);
    }
    footer {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 32px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .domain {
      font-family: "Geist Mono", monospace;
      font-size: 22px;
      color: var(--muted);
    }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="shot" hidden><img alt=""></div>
    <div class="copy">
      <p class="eyebrow"></p>
      <h1></h1>
      <p class="sub"></p>
    </div>
    <footer>
      <span class="brand">
        <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="12" fill="#1853c6" />
          <g
            transform="translate(6 6) scale(0.8333333)"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"
            />
            <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
          </g>
        </svg>
        Financy
      </span>
      <span class="domain">financy.dev</span>
    </footer>
    <script>
    const query = new URLSearchParams(location.search)
    // Another size, such as GitHub's 1280×640 social preview: the layout keeps its distances.
    for (const element of [document.documentElement, document.body]) {
      if (query.get("cardWidth")) element.style.width = `${Number(query.get("cardWidth"))}px`
      if (query.get("cardHeight")) element.style.height = `${Number(query.get("cardHeight"))}px`
    }
    document.querySelector(".eyebrow").textContent = query.get("eyebrow") ?? ""
    document.querySelector("h1").textContent = query.get("title") ?? ""
    document.querySelector(".sub").textContent = query.get("sub") ?? ""
    const shot = query.get("shot")
    const ready = () => document.body.setAttribute("data-ready", "")
    if (shot) {
      document.body.classList.add("with-shot")
      const frame = document.querySelector(".shot")
      const image = frame.querySelector("img")
      frame.hidden = false
      image.onload = ready
      image.onerror = () => document.body.setAttribute("data-error", shot)
      // How far down the picture the frame starts, in its own pixels.
      image.style.marginTop = `-${Number(query.get("top") ?? 0)}px`
      image.style.marginLeft = `-${Number(query.get("left") ?? 0)}px`
      image.style.width = `${Number(query.get("width") ?? 860)}px`
      image.src = shot
    } else {
      ready()
    }
    </script>
  </body>
</html>
